<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Solicite viagens e serviços com praticidade.">
  <meta name="theme-color" content="#16161D">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Só Serviços">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Só Serviços</title>
  <link rel="manifest" href="manifest.json">
  <script>
    window.gm_authFailure = function() {
      console.error('[KZ DEBUG] Google Maps auth failure. Verifique: 1) Billing ativo no projeto 2) API key sem restrições de API 3) Maps JavaScript API habilitada no projeto correto');
    };
  </script>
  <script src="google_maps_config.js"></script>
  <script>
    (function() {
      function loadFlutter() {
        var flutterScript = document.createElement('script');
        flutterScript.src = 'flutter_bootstrap.js';
        flutterScript.async = true;
        document.body.appendChild(flutterScript);
      }

      var key = window.GOOGLE_MAPS_API_KEY;
      if (!key) {
        console.error('[KZ DEBUG] GOOGLE_MAPS_API_KEY ausente em web/google_maps_config.js');
        loadFlutter();
        return;
      }
      var script = document.createElement('script');
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) + '&libraries=places&v=weekly&loading=async&language=pt-PT&region=AO';
      script.async = true;
      script.onload = loadFlutter;
      script.onerror = loadFlutter;
      document.head.appendChild(script);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
</body>
</html>
